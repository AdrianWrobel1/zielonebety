services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zielonebety_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=zielonebety
      - POSTGRES_USER=zielonebety_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: zielonebety_postgres
    restart: always
    environment:
      POSTGRES_DB: zielonebety
      POSTGRES_USER: zielonebety_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zielonebety_user -d zielonebety"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Optional service: not required by current application architecture.
    # Set to profile 'optional' to save ~50MB RAM on memory-constrained Azure VM.
    profiles: ["optional"]
    image: redis:7-alpine
    container_name: zielonebety_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: zielonebety_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
