[build]
  publish = "web"

[[redirects]]
  from = "/api/*"
  to = "https://qualify-howard-economy-venue.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://qualify-howard-economy-venue.trycloudflare.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
